schema_version: q1-figure-contracts@1.1
shared_style:
  language: English
  png_dpi: 300
  formats:
  - svg
  - png
  grayscale_qa_dir: ../q1_qa
  notes: The typical-timeline SVG intentionally embeds source-video raster thumbnails.
figures:
- name: raw_q1_class_distribution
  category: raw
  claim: Attachment-1 class composition
  source: q1_samples.csv
  evidence: class counts
- name: raw_q1_duration_histogram
  category: raw
  claim: decodable timeline duration
  source: q1_data_quality.csv
  evidence: histogram and median
- name: raw_q1_words_duration_scatter
  category: raw
  claim: text length versus decodable duration
  source: q1_samples.csv + q1_data_quality.csv
  evidence: sample scatter
- name: process_q1_anchor_lengths
  category: process
  claim: post-grouping anchor lengths
  source: q1_samples.csv
  evidence: length histogram
- name: process_q1_validity_boxstrip
  category: process
  claim: per-modality valid ratios
  source: q1_feature_manifest.csv
  evidence: box and sample points
- name: process_q1_face_detection_rate
  category: process
  claim: visual face-detection quality
  source: q1_data_quality.csv
  evidence: sample distribution
- name: process_q1_typical_timeline
  category: process
  claim: readable aligned example
  source: q1_alignment.csv + q1_features.npz + source MP4
  evidence: six anchors, keyframes and descriptor changes
- name: result_q1_coverage
  category: result
  claim: full-sample valid coverage
  source: q1_feature_manifest.csv
  evidence: labeled bars
- name: result_q1_overlap_cka
  category: result
  claim: aggregate representation agreement relative to null
  source: q1_overlap_similarity.csv + q1_overlap_permutation.csv
  evidence: observed CKA and permutation interval
- name: result_q1_overlap_procrustes
  category: result
  claim: cross-representation residuals
  source: q1_overlap_similarity.csv
  evidence: boxplots and sample points
- name: flow_overall_model
  category: flow
  claim: implemented extraction and audit order
  source: scripts/q1_*.py
  evidence: dual resolutions and audit branch
